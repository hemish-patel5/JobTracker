spring.application.name=jobtracker
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker
spring.datasource.username=${DB_USERNAME:jobtracker_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

google.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID}
google.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET}
google.gmail.redirect-uri=http://localhost:8080/api/gmail/oauth2/callback
app.frontend-url=http://localhost:5173
