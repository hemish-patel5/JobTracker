spring.application.name=jobtracker
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

google.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID}
google.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET}
google.gmail.redirect-uri=${GOOGLE_GMAIL_REDIRECT_URI}
app.frontend-url=${FRONTEND_URL}

ntfy.url=https://ntfy.sh
ntfy.topic=${NTFY_TOPIC}

scheduler.secret=${SCHEDULER_SECRET}


spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=600000

spring.jpa.open-in-view=false
