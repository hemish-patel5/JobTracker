spring.application.name=jobtracker
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

google.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID}
google.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET}
google.gmail.redirect-uri=${GOOGLE_GMAIL_REDIRECT_URI:http://localhost:8080/api/gmail/oauth2/callback}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

ntfy.url=https://ntfy.sh
ntfy.topic=${NTFY_TOPIC}
