# contact Google or use real credentials.
google.gmail.client-id=test-client-id
google.gmail.client-secret=test-client-secret
google.gmail.redirect-uri=http://localhost:8080/api/gmail/oauth2/callback
app.frontend-url=http://localhost:5173
ntfy.url=https://ntfy.sh
ntfy.topic=test-topic
